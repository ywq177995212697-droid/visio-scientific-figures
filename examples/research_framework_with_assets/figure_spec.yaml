template: framework
title: Anonymized System-Simulation Journal Figure Reconstruction
canvas:
  width_in: 11.6
  height_in: 6.6
style:
  base: chinese-journal
  fills: ["#EAF3FA", "#E8F3F0", "#FFF2D9", "#F6F7F9"]
  strokes: ["#1F5F99", "#0F6B5F", "#A86A16", "#4B6075"]
  font_candidates: ["Arial", "Times New Roman", "Microsoft YaHei", "SimSun"]
nodes:
  - id: source_preview
    shape: image
    image: assets/source_figure_blurred.png
    x: 0.72
    y: 1.02
    w: 4.35
    h: 1.08
  - id: showcase_note
    text: "Blurred source figure -> editable Visio reconstruction\nPrivate terms are replaced by generic research labels"
    image: assets/spec.svg
    image_mode: left
    x: 5.42
    y: 1.04
    w: 5.35
    h: 0.86
    font_size: 8.3
  - id: task_input
    text: Natural-language study task
    image: assets/literature.svg
    image_mode: left
    x: 0.72
    y: 2.38
    w: 2.25
    h: 0.50
  - id: scenario_context
    text: Scenario context
    image: assets/dataset.svg
    image_mode: left
    x: 3.24
    y: 2.38
    w: 2.05
    h: 0.50
  - id: system_facts
    text: System composition facts
    image: assets/spec.svg
    image_mode: left
    x: 5.58
    y: 2.38
    w: 2.25
    h: 0.50
  - id: constraints
    text: Requirement constraints
    image: assets/check.svg
    image_mode: left
    x: 8.12
    y: 2.38
    w: 2.25
    h: 0.50
  - id: parse
    text: Task parsing
    image: assets/literature.svg
    image_mode: top
    x: 0.62
    y: 3.48
    w: 1.90
    h: 0.82
    font_size: 7.7
  - id: abstract
    text: Abstraction
    image: assets/spec.svg
    image_mode: top
    x: 2.74
    y: 3.48
    w: 1.90
    h: 0.82
    font_size: 7.7
  - id: design
    text: Design synthesis
    image: assets/visio.svg
    image_mode: top
    x: 4.86
    y: 3.48
    w: 1.90
    h: 0.82
    font_size: 7.7
  - id: code
    text: Code generation
    image: assets/export.svg
    image_mode: top
    x: 6.98
    y: 3.48
    w: 1.90
    h: 0.82
    font_size: 7.7
  - id: verify
    text: Integration check
    image: assets/check.svg
    image_mode: top
    x: 9.10
    y: 3.48
    w: 1.90
    h: 0.82
    font_size: 7.7
  - id: knowledge_base
    text: Domain knowledge base
    image: assets/dataset.svg
    image_mode: left
    x: 0.72
    y: 5.08
    w: 2.25
    h: 0.50
  - id: rule_library
    text: Rule and pattern library
    image: assets/check.svg
    image_mode: left
    x: 3.24
    y: 5.08
    w: 2.05
    h: 0.50
  - id: template_library
    text: Code template library
    image: assets/spec.svg
    image_mode: left
    x: 5.58
    y: 5.08
    w: 2.25
    h: 0.50
  - id: output_package
    text: |-
      Executable model package
      Python / C++ / XML / JSON
    image: assets/export.svg
    image_mode: left
    x: 8.12
    y: 4.92
    w: 2.55
    h: 0.82
    font_size: 8.0
groups:
  - id: source
    title: Source Reference (Anonymized)
    nodes: [source_preview, showcase_note]
    x: 0.35
    y: 0.68
    w: 10.90
    h: 1.55
  - id: input
    title: Input Layer
    nodes: [task_input, scenario_context, system_facts, constraints]
    x: 0.35
    y: 2.12
    w: 10.90
    h: 0.98
  - id: generation
    title: Generation Layer
    nodes: [parse, abstract, design, code, verify]
    x: 0.35
    y: 3.22
    w: 10.90
    h: 1.32
    title_x: 8.62
    title_y: 3.29
    title_w: 1.62
  - id: support
    title: Knowledge & Export Layer
    nodes: [knowledge_base, rule_library, template_library, output_package]
    x: 0.35
    y: 4.72
    w: 10.90
    h: 1.30
    title_x: 4.70
    title_w: 2.90
connectors:
  - from: task_input
    to: parse
    route: elbow
  - from: scenario_context
    to: abstract
    route: elbow
  - from: system_facts
    to: design
    route: elbow
  - from: constraints
    to: verify
    route: elbow
  - from: parse
    to: abstract
  - from: abstract
    to: design
  - from: design
    to: code
  - from: code
    to: verify
  - from: knowledge_base
    to: parse
    route: elbow
    dashed: true
  - from: rule_library
    to: abstract
    route: elbow
    dashed: true
  - from: template_library
    to: code
    route: elbow
    dashed: true
  - from: verify
    to: output_package
    route: elbow
exports:
  dir: output
  stem: research_framework_with_assets
